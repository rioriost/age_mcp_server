name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra test --extra telemetry --group dev

      - name: Run release checks
        run: make check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      age:
        image: apache/age:release_PG18_1.7.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AGE_TEST_CONNECTION_STRING: >-
        host=127.0.0.1 port=5432 dbname=postgres
        user=postgres password=postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra test --group dev

      - name: Run Apache AGE integration tests
        run: uv run pytest -m integration tests/integration
